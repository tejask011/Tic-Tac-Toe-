<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bitcount+Grid+Double+Ink:wght@100..900&family=Caveat:wght@400..700&display=swap" rel="stylesheet">

</head>
<body>

<div class="container">
    <h1>
    Tic Tac Toe
</h1>
    <div class="grid"> 

    <div class="row">
        <div id="0" onclick="clicked(this)" class="col"></div>
        <div id="1"class="col" onclick="clicked(this)"></div>
        <div id="2"class="col" onclick="clicked(this)"></div>
    </div>

    <div class="row">
        <div id="3"class="col" onclick="clicked(this)"></div>
        <div id="4"class="col" onclick="clicked(this)"></div>
        <div id="5"class="col" onclick="clicked(this)"></div>

    </div>
    <div class="row">
        <div id="6"class="col" onclick="clicked(this)"></div>
        <div  id="7"class="col" onclick="clicked(this)"></div>
        <div  id="8"class="col"onclick="clicked(this)"></div>
    </div>
    
</div>
</div>
    <h2>

    </h2>



<script src="script.js"></script>
</body>
</html>
